<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lời tỏ tình dành cho em ❤️</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        );

        :root {
            --pink: #ff477e;
            --pink-light: #ff85a1;
            --pink-soft: #fff0f5;
            --red: #ff1744;
            --purple: #8e44ad;
            --text: #4a2c3a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Montserrat", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%,
                    rgba(255, 182, 193, 0.65),
                    transparent 30%),
                radial-gradient(circle at 80% 80%,
                    rgba(255, 105, 180, 0.4),
                    transparent 35%),
                linear-gradient(135deg,
                    #fff5f8,
                    #ffd6e2,
                    #ffc2d4);
        }

        button {
            border: none;
            font-family: inherit;
            cursor: pointer;
        }

        .page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
            transition:
                opacity 0.7s ease,
                visibility 0.7s ease,
                transform 0.7s ease;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        /* Trái tim nền */

        .floating-heart {
            position: fixed;
            bottom: -60px;
            z-index: 0;
            color: rgba(255, 71, 126, 0.35);
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform:
                    translateY(0) rotate(0deg) scale(0.6);
            }

            15% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translateY(-120vh) rotate(360deg) scale(1.4);
            }
        }

        /* Trang lá thư */

        .letter-wrapper {
            position: relative;
            z-index: 2;
            width: min(680px, 95vw);
            perspective: 1200px;
        }

        .envelope {
            position: relative;
            width: 100%;
            min-height: 490px;
            padding: 44px 42px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow:
                0 25px 70px rgba(159, 36, 78, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            animation: letterAppear 1.1s ease both;
        }

        .envelope::before,
        .envelope::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            filter: blur(5px);
            z-index: -1;
        }

        .envelope::before {
            top: -90px;
            left: -80px;
            background: rgba(255, 133, 161, 0.28);
        }

        .envelope::after {
            right: -80px;
            bottom: -90px;
            background: rgba(196, 113, 237, 0.2);
        }

        @keyframes letterAppear {
            from {
                opacity: 0;
                transform:
                    translateY(80px) rotateX(-12deg);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0) rotateX(0);
            }
        }

        .letter-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: white;
            font-size: 36px;
            background:
                linear-gradient(135deg,
                    var(--pink),
                    var(--red));
            box-shadow:
                0 12px 30px rgba(255, 23, 68, 0.32);
            animation: heartbeat 1.4s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.12);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.08);
            }

            70% {
                transform: scale(1);
            }
        }

        .letter-title {
            margin-bottom: 22px;
            text-align: center;
            font-family: "Dancing Script", cursive;
            font-size: clamp(38px, 7vw, 56px);
            color: var(--pink);
        }

        .letter-content {
            min-height: 180px;
            font-size: clamp(15px, 2.3vw, 18px);
            line-height: 1.9;
            text-align: justify;
        }

        .cursor {
            display: inline-block;
            color: var(--pink);
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .signature {
            margin-top: 12px;
            text-align: right;
            font-family: "Dancing Script", cursive;
            font-size: 28px;
            font-weight: 700;
            color: var(--pink);
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .signature.show {
            opacity: 1;
        }

        .continue-button {
            display: block;
            margin: 26px auto 0;
            padding: 14px 34px;
            border-radius: 999px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background:
                linear-gradient(135deg,
                    var(--pink),
                    var(--red));
            box-shadow:
                0 12px 25px rgba(255, 23, 68, 0.3);
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
            transition:
                opacity 0.6s ease,
                transform 0.6s ease,
                box-shadow 0.25s ease;
        }

        .continue-button.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .continue-button:hover {
            transform:
                translateY(-4px) scale(1.03);
            box-shadow:
                0 17px 32px rgba(255, 23, 68, 0.38);
        }

        /* Trang câu hỏi */

        .question-card {
            position: relative;
            z-index: 2;
            width: min(760px, 95vw);
            min-height: 530px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 34px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow:
                0 28px 80px rgba(159, 36, 78, 0.22);
            backdrop-filter: blur(20px);
        }

        .big-heart {
            position: relative;
            margin-bottom: 30px;
            font-size: clamp(80px, 15vw, 130px);
            filter:
                drop-shadow(0 14px 20px rgba(255, 23, 68, 0.25));
            animation: heartbeat 1.3s infinite;
        }

        .question-title {
            max-width: 650px;
            font-family: "Dancing Script", cursive;
            font-size: clamp(38px, 7vw, 64px);
            line-height: 1.25;
            color: var(--pink);
            text-shadow: 0 4px 15px rgba(255, 71, 126, 0.15);
        }

        .question-description {
            margin-top: 15px;
            font-size: 16px;
            color: #765363;
        }

        .button-area {
            position: relative;
            width: min(520px, 100%);
            height: 145px;
            margin-top: 32px;
        }

        .answer-button {
            position: absolute;
            min-width: 135px;
            padding: 15px 28px;
            border-radius: 999px;
            font-size: 17px;
            font-weight: 700;
            transition:
                left 0.22s ease,
                top 0.22s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
            user-select: none;
        }

        #yesButton {
            left: 18%;
            top: 35px;
            color: white;
            background:
                linear-gradient(135deg,
                    #ff477e,
                    #ff1744);
            box-shadow:
                0 13px 27px rgba(255, 23, 68, 0.35);
        }

        #yesButton:hover {
            transform:
                translateY(-4px) scale(1.08);
            box-shadow:
                0 18px 34px rgba(255, 23, 68, 0.45);
        }

        #noButton {
            left: 59%;
            top: 35px;
            color: #7a5163;
            background: white;
            box-shadow:
                0 10px 24px rgba(114, 53, 81, 0.16);
        }

        /* Trang kết quả */

        .success-card {
            position: relative;
            z-index: 5;
            width: min(690px, 95vw);
            padding: 60px 35px;
            text-align: center;
            border-radius: 34px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow:
                0 30px 90px rgba(159, 36, 78, 0.28);
            backdrop-filter: blur(20px);
            animation: successAppear 0.9s ease both;
        }

        @keyframes successAppear {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-5deg);
            }

            70% {
                transform: scale(1.06) rotate(2deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .success-heart {
            font-size: clamp(100px, 20vw, 170px);
            animation: heartbeat 1s infinite;
            filter:
                drop-shadow(0 16px 25px rgba(255, 23, 68, 0.35));
        }

        .success-title {
            margin-top: 15px;
            font-family: "Dancing Script", cursive;
            font-size: clamp(44px, 8vw, 72px);
            color: var(--pink);
        }

        .success-text {
            margin-top: 18px;
            font-size: clamp(16px, 2.5vw, 20px);
            line-height: 1.8;
        }

        .love-counter {
            margin-top: 25px;
            font-family: "Dancing Script", cursive;
            font-size: 30px;
            font-weight: 700;
            color: var(--red);
        }

        /* Pháo hoa trái tim */

        .burst-heart {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            animation: burst 2.2s ease-out forwards;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform:
                    translate(-50%, -50%) scale(0.4) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform:
                    translate(calc(-50% + var(--move-x)),
                        calc(-50% + var(--move-y))) scale(1.6) rotate(var(--rotation));
            }
        }

        @media (max-width: 600px) {
            .envelope {
                min-height: 540px;
                padding: 32px 24px;
                border-radius: 23px;
            }

            .letter-content {
                min-height: 245px;
                font-size: 15px;
                line-height: 1.75;
            }

            .question-card {
                min-height: 570px;
                padding: 35px 18px;
            }

            .button-area {
                height: 175px;
            }

            .answer-button {
                min-width: 115px;
                padding: 13px 20px;
                font-size: 15px;
            }

            #yesButton {
                left: 8%;
            }

            #noButton {
                left: 58%;
            }
        }

        .love-photo {
            width: 320px;
            max-width: 90%;
            margin: 25px auto;
        }

        .love-photo img {
            width: 100%;
            border-radius: 20px;
            border: 6px solid #fff;
            box-shadow: 0 15px 35px rgba(255, 80, 120, .25);
            transition: .4s;
            cursor: pointer;
            object-fit: cover;
        }

        .love-photo img:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 45px rgba(255, 80, 120, .45);
        }
    </style>
</head>

<body>

    <!-- Trang lá thư -->
    <section id="letterPage" class="page active">
        <div class="letter-wrapper">
            <div class="envelope">
                <div class="letter-icon">💌</div>

                <h1 class="letter-title">
                    Gửi bé Ly mít =))))
                </h1>

                <div class="letter-content">
                    <span id="typedText"></span>
                    <span id="typingCursor" class="cursor">|</span>
                </div>

                <div id="signature" class="signature">
                    — Anh Khoa ❤️
                </div>

                <button id="continueButton" class="continue-button" type="button">
                    Đọc tiếp nhé 💕
                </button>
            </div>
        </div>
    </section>

    <!-- Trang câu hỏi -->
    <section id="questionPage" class="page">
        <div class="question-card">
            <div class="big-heart">❤️</div>

            <h2 class="question-title">
                Em có thích anh không?
            </h2>

            <p class="question-description">
                Hãy chọn câu trả lời từ trái tim của em nhé!
            </p>

            <div id="buttonArea" class="button-area">
                <button id="yesButton" class="answer-button" type="button">
                    Có, em đồng ý 💖
                </button>

                <button id="noButton" class="answer-button" type="button">
                    Không 😝
                </button>
            </div>
        </div>
    </section>

    <!-- Trang đồng ý -->
    <section id="successPage" class="page success-page">
        <div class="success-card">
            <div class="success-heart">💖</div>

            <h2 class="success-title">
                Anh biết mà!
            </h2>

            <p class="success-text">
                Cảm ơn em đã xuất hiện và đồng ý bước vào
                câu chuyện của anh.
                <br>
                Từ hôm nay, mình cùng nhau viết nên thật nhiều
                kỷ niệm đẹp nhé!
            </p>
    </section>

    <script>
        const letterPage = document.getElementById("letterPage");
        const questionPage = document.getElementById("questionPage");
        const successPage = document.getElementById("successPage");

        const typedText = document.getElementById("typedText");
        const typingCursor = document.getElementById("typingCursor");
        const signature = document.getElementById("signature");
        const continueButton =
            document.getElementById("continueButton");

        const buttonArea = document.getElementById("buttonArea");
        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");

        /*
         * Thay đổi nội dung lá thư tại đây.
         */
        const letterMessage =
            "Anh đã suy nghĩ rất lâu trước khi viết những dòng này. " +
            "Từ khi gặp em, những ngày bình thường của anh bỗng trở nên " +
            "đặc biệt hơn. Nụ cười của em khiến anh vui, sự xuất hiện của " +
            "em khiến mọi khoảnh khắc trở nên có ý nghĩa. Anh không biết " +
            "tương lai sẽ như thế nào, nhưng anh biết rằng anh muốn được " +
            "quan tâm em, ở bên em và cùng em tạo nên thật nhiều kỷ niệm đẹp.";

        let characterIndex = 0;

        function typeLetter() {
            if (characterIndex < letterMessage.length) {
                typedText.textContent +=
                    letterMessage.charAt(characterIndex);

                characterIndex++;

                const randomSpeed =
                    Math.floor(Math.random() * 18) + 20;

                setTimeout(typeLetter, randomSpeed);
                return;
            }

            typingCursor.style.display = "none";
            signature.classList.add("show");
            continueButton.classList.add("show");
        }

        setTimeout(typeLetter, 900);

        continueButton.addEventListener("click", () => {
            letterPage.classList.remove("active");

            setTimeout(() => {
                questionPage.classList.add("active");
            }, 400);
        });

        /*
         * Di chuyển nút Không đến vị trí ngẫu nhiên.
         */
        function moveNoButton() {
            const areaWidth = buttonArea.clientWidth;
            const areaHeight = buttonArea.clientHeight;

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxLeft = Math.max(
                0,
                areaWidth - buttonWidth
            );

            const maxTop = Math.max(
                0,
                areaHeight - buttonHeight
            );

            let randomLeft;
            let randomTop;
            let attempts = 0;

            /*
             * Tránh để nút Không đè lên nút Có.
             */
            do {
                randomLeft = Math.random() * maxLeft;
                randomTop = Math.random() * maxTop;
                attempts++;
            } while (
                isOverlappingYesButton(
                    randomLeft,
                    randomTop,
                    buttonWidth,
                    buttonHeight
                ) &&
                attempts < 20
            );

            noButton.style.left = `${randomLeft}px`;
            noButton.style.top = `${randomTop}px`;

            const messages = [
                "Không 😝",
                "Chọn lại đi 😜",
                "Không bắt được đâu!",
                "Nút này bị lỗi rồi 🤭",
                "Chỉ được chọn Có thôi!",
                "Em chắc chưa? 😳"
            ];

            noButton.textContent =
                messages[
                Math.floor(Math.random() * messages.length)
                ];
        }

        function isOverlappingYesButton(
            left,
            top,
            width,
            height
        ) {
            const yesLeft = yesButton.offsetLeft;
            const yesTop = yesButton.offsetTop;
            const yesRight = yesLeft + yesButton.offsetWidth;
            const yesBottom = yesTop + yesButton.offsetHeight;

            const noRight = left + width;
            const noBottom = top + height;

            const safeDistance = 20;

            return !(
                noRight < yesLeft - safeDistance ||
                left > yesRight + safeDistance ||
                noBottom < yesTop - safeDistance ||
                top > yesBottom + safeDistance
            );
        }

        /*
         * Máy tính: rê chuột.
         */
        noButton.addEventListener("mouseenter", moveNoButton);

        /*
         * Điện thoại: chạm vào.
         */
        noButton.addEventListener(
            "touchstart",
            (event) => {
                event.preventDefault();
                moveNoButton();
            },
            { passive: false }
        );

        /*
         * Không cho nút Không được click.
         */
        noButton.addEventListener("click", (event) => {
            event.preventDefault();
            moveNoButton();
        });

        /*
         * Khi chọn Có.
         */
        yesButton.addEventListener("click", () => {
            questionPage.classList.remove("active");

            setTimeout(() => {
                successPage.classList.add("active");
                createHeartExplosion();
            }, 350);
        });

        /*
         * Tạo trái tim bay ở nền.
         */
        function createFloatingHeart() {
            const heart = document.createElement("div");

            const heartIcons = [
                "♥",
                "❤",
                "💕",
                "💗",
                "💖"
            ];

            heart.className = "floating-heart";
            heart.textContent =
                heartIcons[
                Math.floor(Math.random() * heartIcons.length)
                ];

            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.fontSize =
                `${Math.random() * 23 + 15}px`;

            const duration = Math.random() * 5 + 7;
            heart.style.animationDuration = `${duration}s`;

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createFloatingHeart, 420);

        /*
         * Hiệu ứng bùng nổ khi chọn Có.
         */
        function createHeartExplosion() {
            const heartIcons = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💓",
                "💘"
            ];

            for (let i = 0; i < 80; i++) {
                const heart = document.createElement("span");

                heart.className = "burst-heart";
                heart.textContent =
                    heartIcons[
                    Math.floor(
                        Math.random() * heartIcons.length
                    )
                    ];

                heart.style.left = "50%";
                heart.style.top = "50%";
                heart.style.fontSize =
                    `${Math.random() * 30 + 16}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 550 + 120;

                const moveX = Math.cos(angle) * distance;
                const moveY = Math.sin(angle) * distance;

                heart.style.setProperty(
                    "--move-x",
                    `${moveX}px`
                );

                heart.style.setProperty(
                    "--move-y",
                    `${moveY}px`
                );

                heart.style.setProperty(
                    "--rotation",
                    `${Math.random() * 720 - 360}deg`
                );

                heart.style.animationDelay =
                    `${Math.random() * 0.35}s`;

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 2800);
            }
        }
    </script>
</body>

</html>
